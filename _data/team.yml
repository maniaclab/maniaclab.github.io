# MANIAC Lab team roster.
#
# Two lists: `current` and `former`. The /team/ page renders `current` as full
# cards and `former` as smaller cards under a "Former Team Members" heading.
#
# Fields:
#   name         full name
#   title        job title (for affiliated members, include the institution)
#   affiliation  optional; shown as a small label for members based elsewhere
#   tenure       optional; years with the Lab, e.g. "2019–2026" (former members)
#   desc         two to four sentence bio
#   icon         portrait under /assets/team/; square images render best
#
# Portraits: square JPEGs, 500 px on a side (default.jpg is the fallback
# silhouette for anyone without a headshot).

current:

  - name: Rob Gardner
    title: Research Professor, Enrico Fermi Institute
    desc: Rob is a physicist on the ATLAS experiment at CERN and the Principal Investigator of the MANIAC Lab. He joined the EFI in 2002 to build the first ATLAS Tier2 prototypes and was a founding member of the Open Science Grid, following the GriPhyN and iVDGL projects. He leads the Analysis Facility at UChicago and the Midwest Tier2 Center, serves in the leadership of the U.S. ATLAS Software and Computing Operations Program, and is a member of IRIS-HEP, where the Lab hosts the Scalable Systems Laboratory. From 2020 to 2023 he served as Deputy Dean for Computing and IT in the Physical Sciences Division at the University of Chicago. He was formerly co-manager of U.S. ATLAS computing facility operations and the UChicago PI for the NSF projects PATh, through which the Lab supported mid-scale physics collaborations running high-throughput computing on the OSG Open Science Pool, FABRIC Across Borders (FAB) and SOTERIA (secure science registries). He is a co-author of the CLARIPHY community whitepaper on AI-native research in physics.
    icon: /assets/team/rgardner.jpg

  - name: Giordon Stark
    title: Research Assistant Professor, Enrico Fermi Institute
    desc: Giordon joined the EFI in 2026 after serving as ATLAS Project Scientist at UC Santa Cruz. A core developer of pyhf and a leader of the ATLAS ITk pixel quality-control software effort, Giordon leads user support for the Analysis Facility and develops its physicist-facing platform, including multi-cluster BinderHub, Dask Gateway, inference-as-a-service and the RP1 research platform, and co-leads the Elwood agentic analysis framework.
    icon: /assets/team/giordon.jpg

  - name: Ilija Vukotic
    title: Senior Computational Scientist
    desc: Ilija joined the EFI in March 2012 as a physicist on ATLAS working on federated data access with XRootD. He builds the ATLAS analytics platform, the ServiceX data delivery service and its successor ServiceY, high-bandwidth data delivery testbeds, and the Lab's AI-assisted operations stack of autonomous monitoring agents, an Analysis Facility assistant and MCP services. He co-leads the Elwood agentic analysis framework.
    icon: /assets/team/ilija.jpg

  - name: Judith Stephen
    title: Linux Systems Administrator
    desc: Judith has run core infrastructure for the Midwest Tier2 Center since January 2015 and leads its day-to-day operations, covering dCache storage, OpenStack, bare-metal provisioning with Foreman and Puppet, grid middleware and security. She also supports the South Pole Telescope, XENON data management with Rucio, and the Lab's OSG and PATh services.
    icon: /assets/team/jstephen.jpg

  - name: Fengping Hu
    title: Senior Scientific Software Developer
    desc: Fengping joined in August 2021 and is the primary engineer of the Analysis Facility platform, spanning Kubernetes, GitOps with FluxCD, Prometheus and Grafana observability, and the BinderHub and REANA services used in IRIS-HEP, HSF and ATLAS training events. Fengping also leads the Lab's work on the IRIS-HEP Scalable Systems Laboratory and Triton inference-as-a-service.
    icon: /assets/team/fengping.jpg

  - name: Farnaz Golnaraghi
    title: HPC Systems Administrator
    desc: Farnaz joined in December 2021 and owns the physical infrastructure of the Analysis Facility and the Midwest Tier2 Center, from servers and Ceph storage to firmware and hardware lifecycle. She operates ServiceX for IRIS-HEP, maintains the OSG access-point backups, and develops JupyterHub environments and AI-assistant tooling for facility users.
    icon: /assets/team/farnaz.jpg

  - name: David Jordan
    title: Systems Administrator
    desc: David joined in May 2019 and keeps the Midwest Tier2 Center and Analysis Facility hardware running across the UChicago data centers, including inventory, networking, Ceph storage monitoring, and the HTCondor flocking that lets Analysis Facility jobs spill over onto MWT2 worker nodes. He also contributes to the RP1 research platform.
    icon: /assets/team/djordan.jpg

  - name: Aidan Rosberg
    title: DevOps Systems Administrator
    affiliation: Indiana University
    desc: Based at Indiana University, Aidan is responsible for the IU site of the Midwest Tier2 Center federation and is the infrastructure owner of the RP1 research and integration platform (Kubernetes, Keycloak identity, Dask Gateway, JupyterHub and BinderHub, REANA). Within the U.S. ATLAS Operations Program he works on integrating heterogeneous computing resources, in particular HPC facilities, into ATLAS distributed computing, and on the closely related AI/ML operations effort, including agentic tooling and MCP interfaces to DOE computing resources.
    icon: /assets/team/aidan.jpg

  - name: Fred Luehring
    title: Senior Scientist
    affiliation: Indiana University
    desc: Fred leads the Indiana University site of the Midwest Tier2 Center and is co-manager of Tier2 Facilities in the U.S. ATLAS Operations Program. A long-standing member of the ATLAS collaboration, he works with the Lab on facility operations, procurement and planning across the MWT2 federation.
    icon: /assets/team/fred.jpg

former:

  - name: Lincoln Bryant
    title: Scientific Systems Engineer
    tenure: 2012–2025
    desc: Lincoln worked on the Midwest Tier2 Center, the Open Science Grid, VC3, SLATE and the IRIS-HEP Scalable Systems Laboratory, and later served as technical lead for the Analysis Facility's Kubernetes and Ceph infrastructure.
    icon: /assets/team/lbryant_BW.jpg

  - name: Pascal Paschos
    title: Senior Computational Scientist
    tenure: 2019–2026
    desc: Pascal coordinated support for mid-scale collaborations through the Open Science Grid and PATh, including SPT-3G, XENON, KOTO, VERITAS, LIGO, IceCube and the EIC, and helped lead the transition of OSG data origins to Pelican.
    icon: /assets/team/pascal.jpg

  - name: Chris Weaver
    title: Scientific Software Engineer
    desc: Chris was the lead developer of the SLATE platform and the team's cybersecurity officer, and rebuilt the CI Connect platform on software and infrastructure he developed for SLATE.
    icon: /assets/team/cweaver.jpg

  - name: Marc Weinberg
    title: Computational Scientist
    desc: Marc worked on the IRIS-HEP ServiceX project for ATLAS and on integrating NSF HPC resources at TACC (Stampede2 and Frontera) with ATLAS distributed computing.
    icon: /assets/team/Marc-Weinberg.jpg

  - name: Jeremy Van
    title: Web Developer
    desc: Jeremy built the VC3 website as a science gateway and, while earning a Masters in Computer Science at the University, the SLATE Console and the CI Connect family of portals (OSG Connect, CMS Connect and others).
    icon: /assets/team/jvan.jpeg

  - name: Neha Lingareddy
    title: Undergraduate Researcher
    desc: As a Computer Science undergraduate in the College, Neha built a Kubernetes backend for VC3, deployed the REANA reproducible analysis framework on the IRIS-HEP Scalable Systems Laboratory, and worked on ServiceX.
    icon: /assets/team/neha.jpg

  - name: Sushant Bansal
    title: Graduate Student in Computer Science
    tenure: 2018–2019
    desc: Sushant worked in the Lab while completing a Masters in Computer Science, studying packet loss with perfSONAR data indexed in Elasticsearch and analyzed with Kibana and Jupyter notebooks.
    icon: /assets/team/sushant.jpg

  - name: Suchandra Thapa
    title: Scientific Software Engineer
    tenure: 2007–2019
    desc: Suchandra was pivotal in building out the Open Science Grid, establishing its first testing and validation clusters, and worked on OSG Connect, VC3 and XENON workflows. He now works at a finance startup in his native Hawaii.
    icon: /assets/team/Suchandra_BW.jpg

  - name: Bala Desinghu
    title: Scientific Software Programmer
    tenure: 2014–2018
    desc: Bala worked in the User Support team for the Open Science Grid, teaching students, postdocs and faculty methods of distributed high-throughput computing. He is now a Senior Scientist in the Office of Advanced Research Computing at Rutgers University.
    icon: /assets/team/Bala.jpg

  - name: Benedikt Riedel
    title: Scientific Software Programmer
    tenure: 2016–2019
    desc: Benedikt worked in the OSG User Support team focusing on mid-scale collaborations, maintaining OSG Connect and supporting XENON1T, VERITAS and SPT-3G. He is now Computing Manager at the IceCube Neutrino Observatory and WIPAC in Madison.
    icon: /assets/team/briedel_BW.jpg
