# About-page timeline. Rendered by _layouts/about.html as an SVG chart
# (lanes x years) with a list fallback on small screens.
#
# Dates are YYYY-MM. `end` may be omitted for ongoing work (`open: true`).
# `approx: true` draws a lighter bar for a funding line whose individual
# awards are not all documented. `url` links to the public award record.

chart:
  start: 2000
  end: 2031          # right edge of the chart
  today: 2026-10

lanes:

