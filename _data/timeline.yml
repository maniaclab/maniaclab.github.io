# About-page timeline. Rendered by _layouts/about.html as an SVG chart
# (lanes x years) with a list fallback on small screens.
#
# Dates are YYYY-MM. `end` may be omitted for ongoing work (`open: true`).
# `approx: true` draws a lighter bar for a funding line whose individual
# awards are not all documented. `url` links to the public award record.

chart:
  start: 2000
  end: 2029          # right edge of the chart
  today: 2026-10

lanes:

  - name: Grid and high-throughput computing
    items:
      - title: GriPhyN
        full: "GriPhyN: Towards Petascale Virtual-Data Grids"
        sponsor: NSF (PI Paul Avery, Florida; UChicago through Ian Foster)
        start: 2000-09
        end: 2007-08
        url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=0086044
      - title: Grid Telemetry
        full: "ITR/AP: Grid Telemetry (started at Indiana, moved to UChicago in 2002)"
        sponsor: NSF, PI Gardner
        start: 2001-09
        end: 2006-08
        url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=0241939
      - title: iVDGL
        full: "iVDGL: An International Virtual-Data Grid Laboratory for Data Intensive Science"
        sponsor: NSF, co-PI Gardner
        start: 2001-09
        end: 2010-08
        url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=0122557
      - title: Open Science Grid
        full: Open Science Grid (UChicago funded from 2006; founding member)
        sponsor: NSF through UW–Madison
        start: 2006-01
        end: 2023-05
        approx: true
        url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=1148698
      - title: CESAR
        full: "CESAR: Data Infrastructure for Open Science in Support of LIGO and IceCube"
        sponsor: NSF, PI Gardner
        start: 2018-10
        end: 2021-09
        url: https://www.nsf.gov/awardsearch/showAward?AWD_ID=1841487
      - title: PATh
        full: Partnership to Advance Throughput Computing (mid-scale collaboration support)
        sponsor: NSF through UW–Madison
        start: 2020-10
        end: 2026-05

  - name: ATLAS
    items:
      - title: UChicago ATLAS group grant
        full: UChicago ATLAS group NSF grant (PI Young-Kee Kim, later David W. Miller); Gardner funded continuously since 2002. Distinct from the US ATLAS Operations Program.
        sponsor: NSF, Division of Physics
        start: 2002-06
        end: 2023-08
        approx: true
      - title: Broadening the Discovery Potential of the LHC
        full: "Broadening the Discovery Potential of the LHC: Instrumentation, Algorithms, and Training for Physics with the ATLAS Experiment and Direct Axion Detection (UChicago ATLAS group grant)"
        sponsor: NSF, PI David W. Miller
        start: 2023-09
