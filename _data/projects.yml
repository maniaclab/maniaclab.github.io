# Projects shown on /projects/.
#
#   current: active projects, rendered as cards with an optional outbound link
#   past:    completed projects, rendered as a compact list
#
# Fields: title, group (agentic | facilities), tagline (one line), desc (2-4 sentences), url + link_text
# (optional), icon (a UIkit icon name: https://getuikit.com/docs/icon),
# years (past projects only).

current:

  - title: Elwood
    group: agentic
    tagline: Agentic analysis framework for high energy physics
    icon: bolt
    desc: Elwood orchestrates AI agents that carry out physics analysis workflows on the Analysis Facility, from Rucio data discovery through ServiceX delivery and Coffea processing to pyhf statistical inference. It is designed for facility reach and operates under Shannon, the Lab's governance framework for AI-assisted operations, where AI proposes and humans decide. Elwood is part of the IRIS-HEP agentic-analysis roadmap and the CLARIPHY community effort on AI agentic analysis systems.

  - title: AEGIS
    group: agentic
    tagline: AI Experimental Grid Infrastructure Sentinel
    icon: search
    desc: AEGIS is an agentic operations platform that provides operational intelligence for ATLAS Distributed Computing Operations. Agents reason over monitoring data, job and transfer analytics and site status to detect problems, explain them and propose actions to operators, improving the monitoring and operation of the distributed computing systems used by ATLAS and potentially other LHC experiments.
    url: https://github.com/maniaclab/aegis
    link_text: AEGIS on GitHub

  - title: Shannon
    group: agentic
    tagline: Governance for AI-assisted operations
    icon: lock
    desc: Shannon is the Lab's framework for letting agents help run a facility without being handed the keys. Principles, scoped policies and runbooks live in a git repository and are reviewed as pull requests; a runbook is the atomic unit of trust, stating what an agent may do on its own and what needs a human. Autonomy is earned up a ladder from observe to operate, promoted by evaluation against fault scenarios, and enforced twice, inside the agent by policy awareness and outside it by Kubernetes RBAC, scoped service accounts and sandboxes.

  - title: AF MCP Platform
    group: agentic
    tagline: The USB-C port of the facility
    icon: link
    desc: One credential-brokered Model Context Protocol endpoint through which any AI assistant on a physicist's laptop reaches the Analysis Facility. The broker authenticates every caller against the facility's Keycloak, mints short-lived per-user credentials, applies policy and audits every call, so raw grid credentials never reach the assistant. Built by Giordon Stark, it fronts Rucio, AMI, HTCondor, JupyterLab and the AF filesystem for about 800 users, with a self-service portal, and any analysis facility can deploy it.
    url: /projects/af-mcp-platform/
    link_text: Project page

  - title: USATLAS Marketplace
    group: agentic
    tagline: Facility know-how your agent can install
    icon: cloud-download
    desc: A plugin registry for agent runtimes, added in one line, that packages what a generic model cannot know. Three plugins so far. analysis-facilities, with skills for HTCondor, JupyterLab, XCache, Rucio, ServiceX and Triton at UChicago, BNL and SLAC; atlas, with subagents and more than 25 skills for Rucio, AMI, pyhf, TRExFitter and TopCPToolkit; and hep-python-tools for good-practice Python. Together with the facility's managed settings and context files, it is the portable "playbook" layer of our agentic work.
    url: https://github.com/usatlas/marketplace
    link_text: usatlas/marketplace on GitHub

  - title: Conditions Data Caching for ATLAS
    group: agentic
    tagline: A new global delivery model for detector conditions
    icon: cloud-upload
    desc: Every ATLAS job needs calibration and alignment data from the conditions database at CERN, at peaks above 20,000 requests a minute. With the ATLAS computing team we replaced the mesh of site-level Squid proxies with high-capacity regional Varnish caches behind location-aware DNS, and re-architected the Frontier launchpad on redundant Kubernetes clusters. The result is 30 percent faster delivery with a third of the servers, a sustained cache hit rate above 99 percent, and a year of uninterrupted operation. Metrics flow to Elasticsearch at UChicago, where an on-premise AI agent flags anomalous traffic. Presented at CHEP 2026.

  - title: Analysis Facility at UChicago
    group: facilities
    tagline: Interactive and batch computing for ATLAS physicists
    icon: laptop
    desc: A Kubernetes-based facility serving U.S. ATLAS physicists and their collaborators, with JupyterHub and BinderHub notebooks, Dask clusters, HTCondor batch that flocks onto the Midwest Tier2 Center, GPUs for machine learning and inference, and petabyte-scale Ceph storage with XCache data delivery. More than 850 registered users; an AI assistant and autonomous monitoring agents support users and operators.
    url: https://af.uchicago.edu
    link_text: af.uchicago.edu

  - title: IRIS-HEP Scalable Systems Laboratory
    group: facilities
    tagline: Where analysis systems for the HL-LHC are built and tested
    icon: database
    desc: MANIAC Lab hosts the Scalable Systems Laboratory (SSL) of IRIS-HEP, the NSF Institute for Research and Innovation in Software for High Energy Physics. The SSL is the institute's testbed for new analysis systems, where ServiceX, Coffea, Dask and inference services are integrated at scale, benchmarked against the data rates of the High-Luminosity LHC, and taught in IRIS-HEP, HSF and ATLAS training events. The Lab leads the SSL and contributes to the IRIS-HEP Analysis Systems area and its agentic-analysis roadmap.
    url: https://iris-hep.org/ssl.html
    link_text: iris-hep.org/ssl

  - title: Hosted BinderHub for HEP Training
    group: facilities
    tagline: Zero-install, GPU-capable notebooks for workshops of 25 to 100 people
    icon: play-circle
    desc: Built in the IRIS-HEP Scalable Systems Laboratory, binderhub.ssl-hep.org turns any Git repository into a reproducible JupyterLab session with guaranteed CPU, memory and GPU, pre-pulled images that cut ten-minute cold starts to seconds, Keycloak single sign-on with self-service groups for workshop leads, and multi-cluster federation that places sessions on the UChicago Analysis Facility, the SSL River cluster or the National Research Platform. It has served HSF-India, CODAS-HEP and PyHEP workshops, with Dask Gateway scale-out to HTCondor workers next. Presented at CHEP 2026.
    url: https://binderhub.ssl-hep.org
    link_text: binderhub.ssl-hep.org

  - title: Midwest Tier2 Center
    group: facilities
    tagline: ATLAS production computing across UChicago, Indiana and Illinois
    icon: server
    desc: Founded in 2005 by the University of Chicago and Indiana University, and joined in 2011 by the University of Illinois at Urbana-Champaign (Mark Neubauer, local PI) through the Illinois Campus Cluster, MWT2 is one of the largest Tier2 centers in the Worldwide LHC Computing Grid. It provides more than 40,000 CPU cores and 25 PB of storage for ATLAS simulation, reconstruction and analysis, and hosts the LOCALGROUPDISK and analytics services used by the U.S. ATLAS community.
    url: https://maniaclab.uchicago.edu/collaborations/atlas/
    link_text: More on our ATLAS work

  - title: RP1
    group: facilities
    tagline: R&D and integration platform for ATLAS computing
    icon: cog
    desc: RP1 is the incubator where new patterns are validated before they move into the production Analysis Facility. It is a multi-site Kubernetes platform spanning UChicago and Indiana University with a BinderHub front door, Keycloak identity, Dask Gateway and TaskVine scheduling, Kueue, and the ServiceX and Coffea analysis stack, all managed as declarative infrastructure with FluxCD.
    url: https://rp1.hl-lhc.io
    link_text: rp1.hl-lhc.io

  - title: ServiceX and ServiceY
    group: facilities
    tagline: Columnar data delivery for high energy physics analysis
    icon: cloud-download
    desc: ServiceX, developed with IRIS-HEP, transforms experiment data into analysis-ready columnar arrays on demand and runs in production on the Analysis Facility. ServiceY is the Lab's next-generation delivery service, demonstrated at 300 Gbps on the FABRIC testbed, designed for the data rates of the High-Luminosity LHC.
    url: https://iris-hep.org/projects/servicex.html
    link_text: ServiceX at IRIS-HEP

  - title: Open Data Facility
    group: facilities
    tagline: A U.S. home for ATLAS Open Data
    icon: world
    desc: The Open Data Facility mirrors ATLAS Open Data in the United States and offers several ways to work with it, from BinderHub and JupyterHub notebooks to reproducible REANA workflows, all running on RP1. It supports education, outreach and AI-era research on open physics data, and is being developed with the CLARIPHY community.

past:

  - title: SLATE
    tagline: Services Layer At The Edge
    years: 2017–2023
    desc: An NSF-funded project with the University of Michigan and the University of Utah that built a Kubernetes-based edge platform so central teams could deploy and operate science services (data caches, gateways, workflow services) inside campus Science DMZs. SLATE patterns live on in the Analysis Facility and RP1.

  - title: VC3
    tagline: Virtual Clusters for Community Computation
    years: 2016–2019
    desc: A DOE-funded project with Notre Dame and Brookhaven, VC3 let users allocate virtual clusters on top of existing HPC and HTC facilities and bring self-configuring workloads to them, driven by LHC analysis requirements.

  - title: DASPOS
    tagline: Data and Software Preservation for Open Science
    years: 2012–2017
    desc: An NSF project led by Notre Dame (Michael Hildreth) with Douglas Thain, Mark Neubauer and the Lab, DASPOS was an early exploration of how to preserve HEP data, software and the context needed to understand, trust and reuse them, from container strategies and workflow capture to data citation, with workshops that drew digital librarians and other data-intensive sciences into the conversation. Its ideas carry on in REANA and the Open Data Facility.

  - title: Open Science Grid and PATh
    tagline: High-throughput computing for mid-scale collaborations
    years: 2006–2026
    desc: MANIAC Lab was a founding member of the Open Science Grid and ran its user support and OSG Connect services for many years. Under the NSF PATh project the Lab supported mid-scale physics collaborations, including SPT-3G, XENON, KOTO, VERITAS, LIGO, IceCube and the EIC, running high-throughput computing on the OSG Open Science Pool.

  - title: SOTERIA
    tagline: Secure science registries
    years: 2021–2025
    desc: An NSF project led by the Lab that provided trusted container and software registries for the science community, so that research platforms could run vetted, signed images.

  - title: FABRIC Across Borders
    tagline: International testbed networking
    years: 2020–2025
    desc: With the FABRIC team, FAB extended the FABRIC programmable research network testbed to international partners, including CERN, and the Lab used it for high-bandwidth data delivery experiments such as ServiceY.
