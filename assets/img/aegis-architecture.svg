<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 880" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">AEGIS, OWL and the facility-as-context architecture</title>
  <desc id="d">Three agent domains — Elwood for physics analysis, Shannon for facility operations and AEGIS for ATLAS distributed computing operations — together with people's own AI assistants, all authenticate through one Keycloak realm federated to CERN SSO. They reach the facility through two MCP front doors: the AF MCP Platform gateway, which brokers short-lived per-service credentials, and the AEGIS per-server MCP endpoints, which give ATLAS-wide reach. Behind those doors sit the facility's own services, the ATLAS distributed computing systems, and OWL. OWL is the knowledge layer: sources including wikis, tickets, experts and agent memory flow through an ingest pipeline that parses, extracts claims, resolves entities, checks novelty, detects contradictions and commits, into a Postgres claim store where every claim carries span provenance, two timelines and a status. OWL covers ATLAS distributed computing operations today, with the Analysis Facility and the Open Data Facility planned.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#800000"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#bbb;stroke-width:1.2;rx:8}
    .src{fill:#f6f6f6;stroke:#bbb;stroke-width:1.2;rx:8}
    .ext{fill:#fff;stroke:#bbb;stroke-width:1.2;stroke-dasharray:5 4;rx:8}
    .idb{fill:#f2f6f8;stroke:#155F83;stroke-width:1.3;rx:8}
    .owlb{fill:#fcf7f7;stroke:#800000;stroke-width:1.3;rx:8}
    .lab{font-size:12.5px;fill:#222;font-weight:600}
    .labw{font-size:12.5px;fill:#800000;font-weight:700}
    .sub{font-size:10.5px;fill:#666}
    .ctl{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .data{stroke:#800000;stroke-width:2.6;fill:none;marker-end:url(#a2)}
    .zone{font-size:10.5px;fill:#800000;font-weight:700;letter-spacing:.08em}
    .zoneb{font-size:10.5px;fill:#155F83;font-weight:700;letter-spacing:.08em}
    .owlregion{fill:none;stroke:#800000;stroke-width:1.3;stroke-dasharray:4 4;rx:10}
    .step{fill:#fff;stroke:#bbb;stroke-width:1.1;rx:5}
    .stepn{font-size:10.5px;fill:#222;font-weight:600}
  </style>

  <!-- WHO ASKS -->
  <text class="zone" x="20" y="58">WHO ASKS</text>
  <rect class="src" x="20" y="70" width="264" height="80"/>
  <text class="lab" x="32" y="92">People's assistants</text>
  <text class="sub" x="32" y="110">Claude, ChatGPT, VS Code,</text>
  <text class="sub" x="32" y="124">the AF chatbot</text>
  <text class="sub" x="32" y="140">a physicist at their own laptop</text>

  <rect class="box" x="296" y="70" width="264" height="80"/>
  <text class="lab" x="308" y="92">Elwood</text>
  <text class="sub" x="308" y="110">agentic physics analysis:</text>
  <text class="sub" x="308" y="124">discovery, delivery, processing,</text>
  <text class="sub" x="308" y="140">statistical inference</text>

  <rect class="box" x="572" y="70" width="264" height="80"/>
  <text class="lab" x="584" y="92">Shannon</text>
  <text class="sub" x="584" y="110">facility operations agents</text>
  <text class="sub" x="584" y="124">and the governance that says</text>
  <text class="sub" x="584" y="140">what they may do alone</text>

  <rect class="box" x="848" y="70" width="272" height="80"/>
  <text class="lab" x="860" y="92">AEGIS</text>
  <text class="sub" x="860" y="110">ADC operations agents:</text>
  <text class="sub" x="860" y="124">networks, PanDA, Rucio,</text>
  <text class="sub" x="860" y="140">conditions, benchmarks</text>

  <!-- IDENTITY -->
  <text class="zoneb" x="20" y="186">ONE IDENTITY</text>
  <rect class="idb" x="20" y="196" width="1100" height="46"/>
  <text class="lab" x="32" y="218">Keycloak, realm AF-platform, federated to CERN SSO</text>
  <text class="sub" x="32" y="234">Every caller resolves to a person or a service. Writes are attributed or they are worthless.</text>

  <!-- FRONT DOORS -->
  <text class="zone" x="20" y="278">TWO FRONT DOORS, ONE IDENTITY</text>
  <rect class="box" x="20" y="290" width="540" height="86"/>
  <text class="lab" x="32" y="312">AF MCP Platform gateway</text>
  <text class="sub" x="32" y="330">One endpoint. A credential broker mints short-lived</text>
  <text class="sub" x="32" y="344">per-service tokens, applies policy and audits every call.</text>
  <text class="sub" x="32" y="362">Raw facility credentials never reach the assistant.</text>

  <rect class="box" x="580" y="290" width="540" height="86"/>
  <text class="lab" x="592" y="312">AEGIS MCP endpoints</text>
  <text class="sub" x="592" y="330">One endpoint per server, each with its own OAuth scope.</text>
  <text class="sub" x="592" y="344">Reachable from anywhere in ATLAS, not only from the</text>
  <text class="sub" x="592" y="362">facility, which is what ADC-wide operations needs.</text>

  <!-- WHAT THEY REACH -->
  <text class="zone" x="20" y="412">WHAT THEY REACH</text>
  <rect class="src" x="20" y="424" width="350" height="78"/>
  <text class="lab" x="32" y="446">Facility services</text>
  <text class="sub" x="32" y="464">Rucio, AMI, HTCondor, JupyterLab,</text>
  <text class="sub" x="32" y="478">the AF filesystem, inference</text>
  <text class="sub" x="32" y="494">live state, through the gateway</text>

  <rect class="src" x="386" y="424" width="350" height="78"/>
  <text class="lab" x="398" y="446">ATLAS distributed computing</text>
  <text class="sub" x="398" y="464">CRIC, Rucio, GGUS,</text>
  <text class="sub" x="398" y="478">monitoring in Elasticsearch</text>
  <text class="sub" x="398" y="494">live state, across the grid</text>

  <rect class="owlb" x="752" y="424" width="368" height="78"/>
  <text class="labw" x="764" y="446">OWL · read</text>
  <text class="sub" x="764" y="464">search_knowledge, get_claim, traverse_entity,</text>
  <text class="sub" x="764" y="478">get_timeline, fetch_source</text>
  <text class="sub" x="764" y="494">what is known, with citations and warnings</text>

  <!-- OWL REGION -->
  <rect class="owlregion" x="20" y="540" width="1100" height="252"/>
  <text class="zone" x="32" y="532">OWL — THE KNOWLEDGE LAYER · CLAIMS, NOT CHUNKS</text>

  <text class="sub" x="32" y="562">SOURCES</text>
  <rect class="src" x="32" y="572" width="218" height="40"/>
  <text class="lab" x="42" y="590">Wikis, GitHub, Indico</text><text class="sub" x="42" y="604">connectors watch and re-queue on change</text>
  <rect class="src" x="32" y="620" width="218" height="40"/>
  <text class="lab" x="42" y="638">Tickets and mail</text><text class="sub" x="42" y="652">GGUS, operations channels</text>
  <rect class="src" x="32" y="668" width="218" height="40"/>
  <text class="lab" x="42" y="686">Experts</text><text class="sub" x="42" y="700">the Apprentice agent asks, briefly</text>
  <rect class="src" x="32" y="716" width="218" height="40"/>
  <text class="lab" x="42" y="734">Agent memory</text><text class="sub" x="42" y="748">always quarantined until confirmed</text>

  <text class="sub" x="286" y="562">INGEST — THE WORK HAPPENS AT WRITE TIME</text>
  <rect class="step" x="286" y="572" width="300" height="30"/><text class="stepn" x="296" y="591">1 · Parse — only human turns are citable</text>
  <rect class="step" x="286" y="608" width="300" height="30"/><text class="stepn" x="296" y="627">2 · Extract — cites line ranges, facts only</text>
  <rect class="step" x="286" y="644" width="300" height="30"/><text class="stepn" x="296" y="663">3 · Resolve — entity by alias, then CRIC</text>
  <rect class="step" x="286" y="680" width="300" height="30"/><text class="stepn" x="296" y="699">4 · Novelty — duplicate, refines, conflicts, new</text>
  <rect class="step" x="286" y="716" width="300" height="30"/><text class="stepn" x="296" y="735">5 · Contradict — supersede, qualify or dispute</text>
  <rect class="step" x="286" y="752" width="300" height="30"/><text class="stepn" x="296" y="771">6 · Commit — one transaction, with an audit entry</text>

  <text class="sub" x="622" y="562">THE STORE</text>
  <rect class="owlb" x="622" y="572" width="228" height="78"/>
  <text class="labw" x="632" y="594">Postgres + pgvector</text>
  <text class="sub" x="632" y="612">claims · entities · edges</text>
  <text class="sub" x="632" y="626">disputes · jobs · audit</text>
  <text class="sub" x="632" y="642">hybrid vector, lexical and entity search</text>
  <rect class="src" x="622" y="660" width="228" height="48"/>
  <text class="lab" x="632" y="680">Originals, by hash</text>
  <text class="sub" x="632" y="696">every claim points back into one</text>

  <text class="sub" x="876" y="562">WHAT MAKES A CLAIM</text>
  <rect class="box" x="876" y="572" width="232" height="44"/>
  <text class="lab" x="886" y="590">Atomic</text><text class="sub" x="886" y="606">one statement, one entity</text>
  <rect class="box" x="876" y="624" width="232" height="44"/>
  <text class="lab" x="886" y="642">Span provenance</text><text class="sub" x="886" y="658">no span, no claim</text>
  <rect class="box" x="876" y="676" width="232" height="44"/>
  <text class="lab" x="886" y="694">Two timelines</text><text class="sub" x="886" y="710">true when · learned when</text>
  <rect class="box" x="876" y="728" width="232" height="44"/>
  <text class="lab" x="886" y="746">Status and decay</text><text class="sub" x="886" y="762">superseded, disputed, stale</text>

  <!-- SCOPE -->
  <rect class="src" x="20" y="812" width="540" height="48"/>
  <text class="lab" x="32" y="832">Today · ATLAS distributed computing operations</text>
  <text class="sub" x="32" y="848">the grid, its services and the people who run them</text>
  <rect class="ext" x="580" y="812" width="540" height="48"/>
  <text class="lab" x="592" y="832">Planned · the Analysis Facility and the Open Data Facility</text>
  <text class="sub" x="592" y="848">the same claim model, extended to facility and open-data knowledge</text>

