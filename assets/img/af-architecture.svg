<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 620" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">UChicago Analysis Facility architecture</title>
  <desc id="d">Physicists reach the Analysis Facility through ssh login nodes, dedicated Jupyter nodes or a credential-brokered MCP gateway. These feed a layer of facility services running on Kubernetes: an HTCondor batch pool, JupyterLab and BinderHub, Coffea-casa with Dask, REANA workflows, ServiceX columnar delivery, Triton inference and XCache. Those services read and write a layered storage system: NFS home directories on ZFS, CephFS user data, a solid-state pool, worker-local scratch, and LOCALGROUPDISK at the Midwest Tier 2 Center. Batch work overflows to the MWT2 HTCondor pool by flocking.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#800000"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#bbb;stroke-width:1.2;rx:8}
    .src{fill:#f6f6f6;stroke:#bbb;stroke-width:1.2;rx:8}
    .ext{fill:#fff;stroke:#bbb;stroke-width:1.2;stroke-dasharray:5 4;rx:8}
    .lab{font-size:12.5px;fill:#222;font-weight:600}
    .sub{font-size:10.5px;fill:#666}
    .ctl{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .data{stroke:#800000;stroke-width:3;fill:none;marker-end:url(#a2)}
    .dash{stroke:#800000;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#a2)}
    .zone{font-size:10.5px;fill:#800000;font-weight:700;letter-spacing:.08em}
    .k8s{fill:none;stroke:#155F83;stroke-width:1.3;stroke-dasharray:4 4;rx:10}
    .k8slab{font-size:10.5px;fill:#155F83;font-weight:700;letter-spacing:.06em}
  </style>

  <!-- users -->
  <text class="zone" x="20" y="60">USERS</text>
  <rect class="src" x="20" y="150" width="150" height="86"/>
  <text class="lab" x="32" y="176">Physicists</text>
  <text class="sub" x="32" y="194">U.S. ATLAS members</text>
  <text class="sub" x="32" y="208">and collaborators</text>
  <text class="sub" x="32" y="224">home-institution login</text>

  <!-- access -->
  <text class="zone" x="210" y="60">ACCESS</text>
  <rect class="box" x="210" y="72" width="190" height="54"/>
  <text class="lab" x="222" y="94">ssh login nodes</text><text class="sub" x="222" y="110">four, DNS round robin</text>
  <rect class="box" x="210" y="140" width="190" height="54"/>
  <text class="lab" x="222" y="162">Jupyter nodes</text><text class="sub" x="222" y="178">four, dedicated to notebooks</text>
  <rect class="box" x="210" y="208" width="190" height="54"/>
  <text class="lab" x="222" y="230">MCP gateway</text><text class="sub" x="222" y="246">short-lived brokered tokens</text>

  <!-- kubernetes boundary -->
  <rect class="k8s" x="430" y="54" width="310" height="470"/>
  <text class="k8slab" x="442" y="44">KUBERNETES · ROOK · CEPH</text>

  <text class="zone" x="442" y="76">FACILITY SERVICES</text>
  <rect class="box" x="442" y="88" width="286" height="54"/>
  <text class="lab" x="454" y="110">HTCondor pool</text><text class="sub" x="454" y="126">8,600 cores · long and short queues</text>
  <rect class="box" x="442" y="152" width="286" height="46"/>
  <text class="lab" x="454" y="174">JupyterLab / BinderHub</text><text class="sub" x="454" y="190">notebooks, Dask scale-out</text>
  <rect class="box" x="442" y="208" width="286" height="46"/>
  <text class="lab" x="454" y="230">Coffea-casa</text><text class="sub" x="454" y="246">columnar analysis environment</text>
  <rect class="box" x="442" y="264" width="286" height="46"/>
  <text class="lab" x="454" y="286">REANA</text><text class="sub" x="454" y="302">reproducible workflows</text>
  <rect class="box" x="442" y="320" width="286" height="46"/>
  <text class="lab" x="454" y="342">ServiceX</text><text class="sub" x="454" y="358">columnar data delivery</text>
  <rect class="box" x="442" y="376" width="286" height="46"/>
  <text class="lab" x="454" y="398">Triton · XCache</text><text class="sub" x="454" y="414">inference as a service, cached reads</text>
  <rect class="src" x="442" y="432" width="286" height="46"/>
  <text class="lab" x="454" y="454">GPUs</text><text class="sub" x="454" y="470">38 across seven nodes · 74 allocatable</text>

  <!-- storage -->
  <text class="zone" x="790" y="60">STORAGE</text>
  <rect class="box" x="790" y="72" width="330" height="50"/>
  <text class="lab" x="802" y="94">/home · NFS on ZFS</text><text class="sub" x="802" y="110">100 GB per user · daily snapshots</text>
  <rect class="box" x="790" y="132" width="330" height="60"/>
  <text class="lab" x="802" y="154">/data · CephFS</text><text class="sub" x="802" y="170">5.2 PB, about 1.7 PB usable at 3x</text><text class="sub" x="802" y="184">5 TB per user · project areas</text>
  <rect class="box" x="790" y="202" width="330" height="50"/>
  <text class="lab" x="802" y="224">Solid-state pool</text><text class="sub" x="802" y="240">for high-I/O workflows</text>
  <rect class="box" x="790" y="262" width="330" height="50"/>
  <text class="lab" x="802" y="284">/scratch · worker-local SSD</text><text class="sub" x="802" y="300">2 to 6 TB per node</text>
  <rect class="box" x="790" y="322" width="330" height="60"/>
  <text class="lab" x="802" y="344">Cold tier · erasure coded</text><text class="sub" x="802" y="360">data no longer actively read,</text><text class="sub" x="802" y="374">returning capacity to the main pool</text>
  <rect class="ext" x="790" y="392" width="330" height="60"/>
  <text class="lab" x="802" y="414">LOCALGROUPDISK</text><text class="sub" x="802" y="430">Rucio endpoint at MWT2</text><text class="sub" x="802" y="444">15 TB per user · XRootD and caches</text>

  <!-- overflow -->
  <rect class="ext" x="442" y="540" width="286" height="56"/>
  <text class="lab" x="454" y="562">Midwest Tier 2 · HTCondor pool</text>
  <text class="sub" x="454" y="578">+13,000 cores by flocking</text>

  <!-- flows -->
  <path class="ctl" d="M170 193 H204"/>
  <path class="ctl" d="M400 99 H436"/>
  <path class="ctl" d="M400 167 H436"/>
  <path class="ctl" d="M400 235 H436"/>
  <path class="data" d="M728 115 H784"/>
  <path class="data" d="M728 231 H784"/>
  <path class="data" d="M728 343 H784"/>
  <path class="data" d="M728 399 H784"/>
  <path class="dash" d="M585 478 V534"/>

  <text class="sub" x="596" y="512">flocking</text>
</svg>
