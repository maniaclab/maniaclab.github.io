<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Operations Analytics Platform architecture</title>
  <desc id="d">Operational data from ATLAS distributed computing, the Analysis Facility, networks and data delivery systems flows through Logstash collectors and custom ingestion into a bare-metal Elasticsearch cluster, and out to Kibana dashboards, GPU analytics servers and the River cluster. Kubernetes clusters at UChicago (River, AF, MWT2) run the collectors and the Zeek network monitor.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#800000"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#bbb;stroke-width:1.2;rx:8}
    .src{fill:#f6f6f6;stroke:#bbb;stroke-width:1.2;rx:8}
    .lab{font-size:12.5px;fill:#222;font-weight:600}
    .sub{font-size:10.5px;fill:#666}
    .ctl{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .data{stroke:#800000;stroke-width:3;fill:none;marker-end:url(#a2)}
    .datan{stroke:#800000;stroke-width:3;fill:none}
    .zone{font-size:10.5px;fill:#800000;font-weight:700;letter-spacing:.08em}
    .node{fill:#155F83;rx:2}
    .node2{fill:#5B8E7D;rx:2}
    .node3{fill:#C68220;rx:2}
  </style>

  <!-- data sources -->
  <text class="zone" x="20" y="60">OPERATIONAL DATA SOURCES</text>
  <g>
    <rect class="src" x="20" y="72" width="200" height="54"/><text class="lab" x="32" y="94">Analysis Facility</text><text class="sub" x="32" y="110">HTCondor ClassAds, accounting, dCache</text>
    <rect class="src" x="20" y="134" width="200" height="54"/><text class="lab" x="32" y="156">ATLAS workload and data</text><text class="sub" x="32" y="172">PanDA jobs and tasks, Rucio events, FTS</text>
    <rect class="src" x="20" y="196" width="200" height="54"/><text class="lab" x="32" y="218">Networks</text><text class="sub" x="32" y="234">perfSONAR, ESnet, Zeek on the SciDMZ</text>
    <rect class="src" x="20" y="258" width="200" height="54"/><text class="lab" x="32" y="280">Data delivery</text><text class="sub" x="32" y="296">ServiceX and ServiceY, XCache, gStream</text>
    <rect class="src" x="20" y="320" width="200" height="54"/><text class="lab" x="32" y="342">Conditions and software</text><text class="sub" x="32" y="358">Frontier, Varnish, Squid, CREST, CVMFS</text>
    <rect class="src" x="20" y="382" width="200" height="54"/><text class="lab" x="32" y="404">Site telemetry</text><text class="sub" x="32" y="420">worker-node benchmarks, GeoDB, alarms</text>
  </g>
  <!-- source bus to collectors -->
  <path class="datan" d="M220 99 H250 V409 H220"/>
  <path class="datan" d="M220 161 H250"/><path class="datan" d="M220 223 H250"/><path class="datan" d="M220 285 H250"/><path class="datan" d="M220 347 H250"/>
  <path class="data" d="M250 200 H318"/>
  <path class="data" d="M250 320 H318"/>

  <!-- Kubernetes clusters -->
  <text class="zone" x="330" y="60">KUBERNETES AT UCHICAGO</text>
  <g>
    <rect class="box" x="330" y="72" width="88" height="40"/><text class="lab" x="344" y="96">River</text>
    <rect class="box" x="426" y="72" width="88" height="40"/><text class="lab" x="440" y="96">AF</text>
    <rect class="box" x="522" y="72" width="88" height="40"/><text class="lab" x="536" y="96">MWT2</text>
  </g>
  <path class="ctl" d="M374 112 V130 H470 V158"/>
  <path class="ctl" d="M470 112 V158"/>
  <path class="ctl" d="M566 112 V130 H470"/>
  <text class="sub" x="620" y="124">clusters run the collectors and</text><text class="sub" x="620" y="137">the Zeek network monitor</text>

  <!-- collectors -->
  <rect class="box" x="320" y="160" width="150" height="80"/><text class="lab" x="334" y="184">Logstash collectors</text><text class="sub" x="334" y="202">pipelines for perfSONAR,</text><text class="sub" x="334" y="215">FTS, AF monitoring, pilots</text>
  <rect class="box" x="320" y="280" width="150" height="80"/><text class="lab" x="334" y="304">Custom ingestion</text><text class="sub" x="334" y="322">scripts from CERN Oracle,</text><text class="sub" x="334" y="335">Hadoop and MONIT</text>
  <rect class="box" x="490" y="160" width="150" height="80"/><text class="lab" x="504" y="184">Zeek</text><text class="sub" x="504" y="202">network monitoring and</text><text class="sub" x="504" y="215">threat detection, 2-week retention</text>
  <path class="ctl" d="M470 130 H565 V158"/>

  <!-- to Elasticsearch -->
  <path class="data" d="M470 200 H485 V395 H540"/>
  <path class="data" d="M470 320 H485"/>
  <path class="data" d="M565 240 V380"/>

  <!-- Elasticsearch -->
  <rect x="540" y="380" width="230" height="110" fill="#fbf7f1" stroke="#C68220" stroke-width="1.5" rx="10"/>
  <text class="lab" x="556" y="406" font-size="14">Elasticsearch cluster</text>
  <text class="sub" x="556" y="424">bare metal, 25 nodes in head, data,</text>
  <text class="sub" x="556" y="437">ingest and cold tiers</text>
  <text class="sub" x="556" y="458">111 billion documents, 5,000+ indices,</text>
  <text class="sub" x="556" y="471">13,000 primary shards</text>

  <!-- consumers -->
  <text class="zone" x="820" y="60">USERS AND ANALYTICS</text>
  <g>
    <rect class="box" x="820" y="72" width="260" height="78"/><text class="lab" x="834" y="96">Kibana dashboards</text><text class="sub" x="834" y="114">ADC coordinators, shifters, AF operators,</text><text class="sub" x="834" y="127">WLCG network monitoring</text>
    <rect class="box" x="820" y="166" width="260" height="78"/><text class="lab" x="834" y="190">Anomaly detection and alerts</text><text class="sub" x="834" y="208">dozens of periodic tasks; results indexed</text><text class="sub" x="834" y="221">back for the record</text>
    <rect class="box" x="820" y="260" width="260" height="78"/><text class="lab" x="834" y="284">GPU analytics servers</text><text class="sub" x="834" y="302">U.S. ATLAS analytics and ML, and the</text><text class="sub" x="834" y="315">SSL River cluster</text>
    <rect class="box" x="820" y="354" width="260" height="78"/><text class="lab" x="834" y="378">AI agents</text><text class="sub" x="834" y="396">AEGIS operations agents and the Analysis</text><text class="sub" x="834" y="409">Facility assistant query the same indices</text>
  </g>
  <path class="datan" d="M770 435 H795 V111 H818"/>
  <path class="data" d="M795 111 H818"/><path class="data" d="M795 205 H818"/><path class="data" d="M795 299 H818"/><path class="data" d="M795 393 H818"/>

  <!-- hardware tiers (no dates) -->
  <text class="zone" x="20" y="520">HARDWARE TIERS</text>
  <g>
    <g transform="translate(20,532)">
      <rect class="node" x="0" y="0" width="60" height="9"/><rect class="node" x="0" y="12" width="60" height="9"/><rect class="node" x="0" y="24" width="60" height="9"/>
      <text class="sub" x="70" y="12">Head and management nodes</text><text class="sub" x="70" y="26">cluster state, transforms</text>
    </g>
    <g transform="translate(290,532)">
      <rect class="node" x="0" y="0" width="60" height="9"/><rect class="node" x="66" y="0" width="60" height="9"/><rect class="node" x="132" y="0" width="60" height="9"/>
      <rect class="node" x="0" y="12" width="60" height="9"/><rect class="node" x="66" y="12" width="60" height="9"/><rect class="node" x="132" y="12" width="60" height="9"/>
      <rect class="node" x="0" y="24" width="60" height="9"/><rect class="node" x="66" y="24" width="60" height="9"/><rect class="node" x="132" y="24" width="60" height="9"/>
      <text class="sub" x="202" y="12">Data nodes</text><text class="sub" x="202" y="26">hot indices on NVMe and SSD</text>
    </g>
    <g transform="translate(620,532)">
      <rect class="node2" x="0" y="0" width="60" height="9"/><rect class="node2" x="0" y="12" width="60" height="9"/>
      <text class="sub" x="70" y="12">Ingest and Kibana nodes</text>
    </g>
    <g transform="translate(850,532)">
      <rect class="node3" x="0" y="0" width="60" height="9"/>
      <text class="sub" x="70" y="12">Cold tier</text><text class="sub" x="70" y="26">long-term, infrequently queried data</text>
    </g>
  </g>
  <text class="sub" x="20" y="588">Built over several procurement cycles with support from the UChicago Physical Sciences Division, the U.S. ATLAS Operations Program,</text>
  <text class="sub" x="20" y="602">the NSF SAND project and the Provost's data-center relocation. A proposed refresh replaces the oldest head and data nodes with six new servers.</text>

  <!-- legend -->
  <line class="ctl" x1="20" y1="628" x2="60" y2="624"/><text class="sub" x="68" y="632">control plane</text>
  <line class="datan" x1="170" y1="628" x2="210" y2="628"/><text class="sub" x="218" y="632">data flow</text>
</svg>
