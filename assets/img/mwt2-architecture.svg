<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 486" font-family="Plus Jakarta Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Midwest Tier 2 Center architecture</title>
  <desc id="d">Three university sites, the University of Chicago, Indiana University and the University of Illinois Urbana-Champaign, present to ATLAS as a single Tier 2 facility. Their compute forms one HTCondor pool of about 42,000 job slots, and disk at Chicago and Indiana is served by dCache totalling 26 petabytes. Work arrives from the ATLAS grid through PanDA, with data placement by Rucio and wide-area access over XRootD. The centre also serves LOCALGROUPDISK to the UChicago Analysis Facility, hosts the Elasticsearch operations analytics platform, and contributes idle cycles to the Open Science Pool.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#800000"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#bbb;stroke-width:1.2;rx:8}
    .src{fill:#f6f6f6;stroke:#bbb;stroke-width:1.2;rx:8}
    .ext{fill:#fff;stroke:#bbb;stroke-width:1.2;stroke-dasharray:5 4;rx:8}
    .lab{font-size:12.5px;fill:#222;font-weight:600}
    .sub{font-size:10.5px;fill:#666}
    .big{font-size:15px;fill:#800000;font-weight:700}
    .ctl{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a1)}
    .data{stroke:#800000;stroke-width:3;fill:none;marker-end:url(#a2)}
    .dash{stroke:#555;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#a1)}
    .zone{font-size:10.5px;fill:#800000;font-weight:700;letter-spacing:.08em}
    .site{fill:none;stroke:#155F83;stroke-width:1.3;stroke-dasharray:4 4;rx:10}
    .sitelab{font-size:10.5px;fill:#155F83;font-weight:700;letter-spacing:.06em}
  </style>

  <!-- grid -->
  <text class="zone" x="20" y="60">ATLAS GRID</text>
  <rect class="src" x="20" y="72" width="210" height="54"/>
  <text class="lab" x="32" y="94">PanDA</text><text class="sub" x="32" y="110">workload management</text>
  <rect class="src" x="20" y="136" width="210" height="54"/>
  <text class="lab" x="32" y="158">Rucio</text><text class="sub" x="32" y="174">data placement across the grid</text>
  <rect class="src" x="20" y="200" width="210" height="54"/>
  <text class="lab" x="32" y="222">XRootD</text><text class="sub" x="32" y="238">wide-area data access</text>

  <!-- the facility -->
  <rect class="site" x="300" y="54" width="430" height="300"/>
  <text class="sitelab" x="312" y="44">ONE FACILITY, THREE UNIVERSITIES</text>

  <text class="zone" x="312" y="76">COMPUTE</text>
  <rect class="box" x="312" y="88" width="406" height="64"/>
  <text class="big" x="324" y="114">42,000 job slots</text>
  <text class="sub" x="324" y="132">one HTCondor pool · about 646,000 HEPSpec</text>
  <text class="sub" x="324" y="146">bare metal · mean age about five years</text>

  <rect class="src" x="312" y="164" width="128" height="64"/>
  <text class="lab" x="324" y="186">UChicago</text><text class="sub" x="324" y="202">compute and disk</text>
  <rect class="src" x="451" y="164" width="128" height="64"/>
  <text class="lab" x="463" y="186">Indiana</text><text class="sub" x="463" y="202">compute and disk</text>
  <rect class="src" x="590" y="164" width="128" height="64"/>
  <text class="lab" x="602" y="186">Illinois</text><text class="sub" x="602" y="202">compute, hosted at</text><text class="sub" x="602" y="216">NCSA's NPCF</text>

  <text class="zone" x="312" y="248">STORAGE</text>
  <rect class="box" x="312" y="260" width="406" height="74"/>
  <text class="big" x="324" y="286">26 PB on dCache</text>
  <text class="sub" x="324" y="304">served at Chicago and Indiana · mean age under three years</text>
  <text class="sub" x="324" y="320">LOCALGROUPDISK is a Rucio endpoint in the same pools</text>

  <!-- consumers -->
  <text class="zone" x="790" y="60">ALSO SERVED FROM HERE</text>
  <rect class="ext" x="790" y="72" width="330" height="72"/>
  <text class="lab" x="802" y="94">UChicago Analysis Facility</text>
  <text class="sub" x="802" y="112">+13,000 cores by flocking, and</text>
  <text class="sub" x="802" y="126">LOCALGROUPDISK at local speed</text>

  <rect class="ext" x="790" y="158" width="330" height="72"/>
  <text class="lab" x="802" y="180">Operations analytics platform</text>
  <text class="sub" x="802" y="198">bare-metal Elasticsearch hosted here,</text>
  <text class="sub" x="802" y="212">indexing ATLAS distributed computing</text>

  <rect class="ext" x="790" y="244" width="330" height="72"/>
  <text class="lab" x="802" y="266">Open Science Pool</text>
  <text class="sub" x="802" y="284">idle cycles contributed opportunistically</text>
  <text class="sub" x="802" y="298">to researchers beyond high energy physics</text>

  <!-- reliability -->
  <rect class="box" x="312" y="388" width="406" height="60"/>
  <text class="big" x="324" y="416">99.8% reliability</text>
  <text class="sub" x="324" y="434">September 2025 to September 2026, from WLCG published records</text>

  <!-- flows -->
  <path class="data" d="M230 99 H294"/>
  <path class="data" d="M230 163 H294"/>
  <path class="data" d="M230 227 H294"/>
  <path class="data" d="M730 108 H784"/>
  <path class="dash" d="M730 192 H784"/>
  <path class="dash" d="M730 278 H784"/>
</svg>
